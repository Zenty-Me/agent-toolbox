name: Check agent capability inventories

on:
  push:
    branches: [main]
  pull_request:

jobs:
  consistency:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check per-agent inventories and links
        run: python scripts/check_consistency.py
      - name: Test preview, conflict handling and synchronization
        run: python -m unittest discover -s scripts -p "test_*.py" -v
